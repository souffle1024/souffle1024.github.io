<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小 Q 的云</title>
    <link rel="shortcut icon" href="images/2bigTag.ico" type="image/x-icon" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            font-size: 28px;
            font-weight: 300;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        .nav-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }
        .nav-btn {
            display: inline-block;
            padding: 15px 30px;
            background: rgba(255,255,255,0.15);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .nav-btn:hover {
            background: rgba(255,255,255,0.25);
            transform: translateY(-2px);
        }
        .credentials {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .credentials p { margin: 8px 0; }
        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .countdown-item {
            text-align: center;
        }
        .countdown-item span {
            display: block;
            font-size: 36px;
            font-weight: 300;
        }
        .countdown-item p {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 5px;
        }
        .countdown-sep {
            font-size: 24px;
            align-self: center;
            opacity: 0.6;
        }
        .countdown-title {
            margin-top: 20px;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>欢迎来到 Souffle 的云</h1>
        
        <div class="nav-buttons">
            <a href="#" class="nav-btn">博客</a>
            <a href="https://www.souffle.cc:5001" class="nav-btn">SouffleCloud</a>
            <a href="https://www.souffle.cc:8083" class="nav-btn">书籍管理</a>
            <a href="#" class="nav-btn">在线影视</a>
        </div>
        
        <div class="credentials">
            <p>访客用户名：abc</p>
            <p>访客密码：123456</p>
        </div>
        
        <ul class="countdown" id="countdown">
            <li class="countdown-item"><span class="days">00</span><p>天</p></li>
            <li class="countdown-sep">:</li>
            <li class="countdown-item"><span class="hours">00</span><p>时</p></li>
            <li class="countdown-sep">:</li>
            <li class="countdown-item"><span class="minutes">00</span><p>分</p></li>
            <li class="countdown-sep">:</li>
            <li class="countdown-item"><span class="seconds">00</span><p>秒</p></li>
        </ul>
        <p class="countdown-title">距离 2023 年 2 月 3 日</p>
    </div>

    <script src="js/jquery.min.js"></script>
    <script src="js/jquery.downCount.js"></script>
    <script>
        $('.countdown').downCount({
            date: '2/3/2023 00:00:00',
            offset: +10
        }, function () {
            alert('倒计时结束!');
        });
    </script>
</body>
</html>
