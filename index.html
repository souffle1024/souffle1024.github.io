    <style type="text/css">
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0a0e1a 0%, #1a0f2e 50%, #0d1b2a 100%);
            color: #00ffff;
            font: normal 12px 'Rajdhani', 'Open Sans', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        /* 网格背景 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }
        
        /* 扫描线效果 */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
        }
        
        .cyber-container {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        /* 标题样式 */
        .cyber-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 48px;
            font-weight: 900;
            text-align: center;
            color: #00ffff;
            text-shadow: 
                0 0 5px #00ffff,
                0 0 10px #00ffff,
                0 0 20px #00ffff,
                0 0 40px #0088ff,
                0 0 80px #0088ff;
            animation: flicker 2s infinite;
            margin-bottom: 40px;
            letter-spacing: 8px;
        }
        
        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                opacity: 1;
            }
            20%, 24%, 55% {
                opacity: 0.5;
            }
        }
        
        /* 按钮容器 */
        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin: 40px 0;
        }
        
        /* 赛博按钮 */
        .cyber-button {
            position: relative;
            background: rgba(0, 255, 255, 0.05);
            border: 2px solid #00ffff;
            color: #00ffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 700;
            padding: 25px 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.3s ease;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            text-decoration: none;
            display: block;
            text-align: center;
        }
        
        .cyber-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }
        
        .cyber-button:hover {
            background: rgba(0, 255, 255, 0.15);
            box-shadow: 
                0 0 10px #00ffff,
                0 0 20px #00ffff,
                inset 0 0 20px rgba(0, 255, 255, 0.2);
            text-shadow: 0 0 10px #00ffff;
            transform: translateY(-3px);
        }
        
        .cyber-button:hover::before {
            left: 100%;
        }
        
        .cyber-button:active {
            transform: translateY(0);
        }
        
        /* 访客信息 */
        .visitor-info {
            background: rgba(255, 0, 128, 0.05);
            border: 1px solid #ff0080;
            padding: 20px 30px;
            margin: 40px 0;
            text-align: center;
            clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
        }
        
        .visitor-info span {
            display: block;
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            margin: 10px 0;
            color: #ff0080;
            text-shadow: 0 0 5px #ff0080;
            letter-spacing: 2px;
        }
        
        .visitor-info span:first-child {
            color: #00ff88;
            text-shadow: 0 0 5px #00ff88;
        }
        
        /* 倒计时样式 */
        ul.countdown {
            list-style: none;
            margin: 60px 0 30px;
            padding: 30px;
            display: block;
            text-align: center;
            background: rgba(0, 255, 255, 0.03);
            border: 1px solid rgba(0, 255, 255, 0.3);
            clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
            position: relative;
        }
        
        ul.countdown li {
            display: inline-block;
            margin: 0 5px;
        }
        
        ul.countdown li span {
            font-family: 'Orbitron', sans-serif;
            font-size: 60px;
            font-weight: 700;
            line-height: 70px;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #0088ff;

        ul.countdown li.seperator {
            font-size: 50px;
            line-height: 60px;

            color: #ff0080;
            text-shadow: 0 0 10px #ff0080;

        ul.countdown li p {

            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
            text-shadow: 0 0 5px #00ff88;
        }
        
        .countdown-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            color: #ff0080;
            text-shadow: 0 0 10px #ff0080;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        
        /* 装饰元素 */
        .cyber-corner {
            position: fixed;
            width: 100px;
            height: 100px;
            border: 2px solid #00ffff;
            pointer-events: none;
            z-index: 2;
        }
        
        .cyber-corner.top-left {
            top: 20px;
            left: 20px;
            border-right: none;
            border-bottom: none;
        }
        
        .cyber-corner.top-right {
            top: 20px;
            right: 20px;
            border-left: none;
            border-bottom: none;
        }
        
        .cyber-corner.bottom-left {
            bottom: 20px;
            left: 20px;
            border-right: none;
            border-top: none;
        }
        
        .cyber-corner.bottom-right {
            bottom: 20px;
            right: 20px;
            border-left: none;
            border-top: none;
        }
        
        /* 发光粒子 */
        .glow-particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: #00ffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            animation: float 15s infinite;
            pointer-events: none;
            z-index: 0;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {

                opacity: 0;
            }

        /* 功能面板样式 */
        .feature-panel {
            background: rgba(0, 255, 255, 0.05);
            border: 2px solid #00ffff;
            padding: 30px;

        /* 倒计时输入样式 */

            justify-content: center;

        /* 画板样式 */

            position: relative;

        .canvas-container {
            background: rgba(0, 0, 0, 0.5);

        .draw-controls {
            display: flex;

        }
        
        .color-picker {
            width: 50px;
            height: 50px;

            color: #00ffff;

        }
        
        .brush-slider {
            -webkit-appearance: none;
            width: 150px;
            height: 8px;
            background: rgba(0, 255, 255, 0.3);
            outline: none;
            clip-path: polygon(5px 0, 100% 0, 100% 100%, 0 100%, 0 5px);
        }
        
        .brush-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #00ffff;
            cursor: pointer;
            box-shadow: 0 0 10px #00ffff;
        }
        
        .section-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        
        .section-tab {
            background: rgba(0, 255, 255, 0.05);

        .section-tab.active {

        }
        
        .section-tab:hover {

        }
        
        .feature-section {
            display: none;
        }
        
        .feature-section.active {
            display: block;
        }
    </style>
</head>

    <script class="source">
        // 标签页切换功能
        document.querySelectorAll('.section-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.section-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.feature-section').forEach(s => s.classList.remove('active'));
                this.classList.add('active');
                document.getElementById(this.dataset.section).classList.add('active');
            });
        });

        // ==================== 倒计时功能 ====================
        let countdownInterval = null;
        
        // 设置默认时间为明天
        const now = new Date();
        now.setDate(now.getDate() + 1);
        now.setHours(0, 0, 0, 0);
        const defaultTime = now.toISOString().slice(0, 16);
        document.getElementById('targetDateInput').value = defaultTime;

        function startCustomCountdown() {
            const inputVal = document.getElementById('targetDateInput').value;
            if (!inputVal) {
                alert('请选择目标日期！');
                return;
            }
            
            const targetDate = new Date(inputVal);
            if (isNaN(targetDate.getTime())) {
                alert('日期格式无效！');
                return;
            }

            if (countdownInterval) {
                clearInterval(countdownInterval);
            }

            countdownInterval = setInterval(function() {
                const now = new Date();
                const difference = targetDate - now;

                if (difference < 0) {
                    clearInterval(countdownInterval);
                    $('.days').text('00');
                    $('.hours').text('00');
                    $('.minutes').text('00');
                    $('.seconds').text('00');
                    $('.days_ref').text('EXPIRED');
                    $('.hours_ref').text('');
                    $('.minutes_ref').text('');
                    $('.seconds_ref').text('');
                    alert('倒计时结束!');
                    return;
                }

                const _second = 1000,
                    _minute = _second * 60,
                    _hour = _minute * 60,
                    _day = _hour * 24;

                const days = Math.floor(difference / _day);
                const hours = Math.floor((difference % _day) / _hour);
                const minutes = Math.floor((difference % _hour) / _minute);
                const seconds = Math.floor((difference % _minute) / _second);

                $('.days').text(days < 10 ? '0' + days : days);
                $('.hours').text(hours < 10 ? '0' + hours : hours);
                $('.minutes').text(minutes < 10 ? '0' + minutes : minutes);
                $('.seconds').text(seconds < 10 ? '0' + seconds : seconds);
                $('.days_ref').text(days === 1 ? 'DAY' : 'DAYS');
                $('.hours_ref').text(hours === 1 ? 'HOUR' : 'HOURS');
                $('.minutes_ref').text(minutes === 1 ? 'MINUTE' : 'MINUTES');
                $('.seconds_ref').text(seconds === 1 ? 'SECOND' : 'SECONDS');
            }, 1000);
        }

        function clearCountdown() {
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
            $('.days').text('00');
            $('.hours').text('00');
            $('.minutes').text('00');
            $('.seconds').text('00');
            $('.days_ref').text('DAYS');
            $('.hours_ref').text('HOURS');
            $('.minutes_ref').text('MINUTES');
            $('.seconds_ref').text('SECONDS');
        }

        document.getElementById('startCountdownBtn').addEventListener('click', startCustomCountdown);
        document.getElementById('clearCountdownBtn').addEventListener('click', clearCountdown);

        // 启动默认倒计时
        startCustomCountdown();

        // ==================== 计算器功能 ====================
        let calcExpression = '';
        const calcDisplay = document.getElementById('calcDisplay');

        function appendCalc(value) {
            if (calcExpression === 'Error' || calcExpression === 'Infinity') {
                calcExpression = '';
            }
            calcExpression += value;
            updateCalcDisplay();
        }

        function clearCalc() {
            calcExpression = '';
            calcDisplay.textContent = '0';
        }

        function calculateResult() {
            try {
                if (calcExpression === '') return;
                const result = eval(calcExpression);
                calcExpression = result.toString();
                updateCalcDisplay();
            } catch (e) {
                calcExpression = 'Error';
                updateCalcDisplay();
                setTimeout(() => {
                    calcExpression = '';
                    updateCalcDisplay();
                }, 1500);
            }
        }

        function updateCalcDisplay() {
            if (calcExpression === '') {
                calcDisplay.textContent = '0';
            } else {
                calcDisplay.textContent = calcExpression;
            }
        }

        // 键盘支持
        document.addEventListener('keydown', function(e) {
            if (document.getElementById('calculator-section').classList.contains('active')) {
                if (e.key >= '0' && e.key <= '9' || e.key === '.' || e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/' || e.key === '(' || e.key === ')') {
                    appendCalc(e.key);
                } else if (e.key === 'Enter' || e.key === '=') {
                    calculateResult();
                } else if (e.key === 'Backspace') {
                    calcExpression = calcExpression.slice(0, -1);
                    updateCalcDisplay();
                } else if (e.key === 'Escape' || e.key === 'c' || e.key === 'C') {
                    clearCalc();
                }
            }
        });

        // ==================== 画板功能 ====================
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let isEraser = false;

        // 设置初始画笔样式
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#00ffff';

        // 调整画布大小
        function resizeCanvas() {
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = 500;
        }
        resizeCanvas();

        // 画笔颜色
        document.getElementById('brushColor').addEventListener('input', function(e) {
            ctx.strokeStyle = e.target.value;
            ctx.shadowColor = e.target.value;
            isEraser = false;
        });

        // 画笔大小
        document.getElementById('brushSize').addEventListener('input', function(e) {
            ctx.lineWidth = e.target.value;
            document.getElementById('brushSizeValue').textContent = e.target.value;
        });

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            const pos = getMousePos(e);
            lastX = pos.x;
            lastY = pos.y;
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            
            const pos = getMousePos(e);
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            
            if (isEraser) {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.shadowBlur = 0;
            } else {
                ctx.globalCompositeOperation = 'source-over';
            }
            
            ctx.stroke();
            
            lastX = pos.x;
            lastY = pos.y;
        }

        function stopDrawing() {
            isDrawing = false;
            ctx.beginPath();
        }

        // 鼠标事件
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        // 触摸事件
        canvas.addEventListener('touchstart', function(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent('mousedown', {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        });

        canvas.addEventListener('touchmove', function(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent('mousemove', {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        });

        canvas.addEventListener('touchend', function(e) {
            e.preventDefault();
            const mouseEvent = new MouseEvent('mouseup', {});
            canvas.dispatchEvent(mouseEvent);
        });

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'source-over';
            ctx.shadowBlur = 10;
            isEraser = false;
        }

        function eraseMode() {
            isEraser = !isEraser;
            if (isEraser) {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.shadowBlur = 0;
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.shadowBlur = 10;
                ctx.shadowColor = document.getElementById('brushColor').value;
            }
        }
    </script>

</body>

</html>
